<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="forestGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112519" />
      <stop offset="100%" stop-color="#1C3F2B" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B76D" />
      <stop offset="50%" stop-color="#C8933A" />
      <stop offset="100%" stop-color="#9E6F1F" />
    </linearGradient>
  </defs>

  <g transform="translate(50, 40)">
    <!-- LEFT: Sleek Minimalist Geometric Packaging Icon -->
    <g transform="translate(70, 110)">
      <!-- Hexagonal / Diamond Folded Bag Line -->
      <path d="M 0 -85 C 0 -115, 45 -115, 45 -85" fill="none" stroke="url(#goldGrad3)" stroke-width="7" stroke-linecap="round" />
      <path d="M -45 -80 L 90 -80 L 80 50 C 78 65, 65 75, 50 75 L -15 75 C -30 75, -42 65, -45 50 Z" 
            fill="none" stroke="url(#forestGrad3)" stroke-width="8" stroke-linejoin="round" />
      
      <!-- Elegant Stylized Leaf Cutout inside bag -->
      <path d="M -10 40 C -35 15, -15 -30, 22 -45 C 45 -10, 30 25, -10 40 Z" fill="url(#forestGrad3)" />
      <path d="M -5 35 C 10 10, 18 -15, 22 -45" fill="none" stroke="url(#goldGrad3)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- RIGHT: High Fashion Typography -->
    <g transform="translate(230, 95)">
      <!-- Main "ECO" in Playfair Display -->
      <text x="0" y="40" 
            font-family="'Playfair Display', Georgia, serif" 
            font-size="78" 
            font-weight="700" 
            fill="url(#forestGrad3)" 
            letter-spacing="4">ECO</text>
      
      <!-- "PRINT & PACK" in architectural uppercase -->
      <text x="210" y="32" 
            font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
            font-size="28" 
            font-weight="800" 
            fill="url(#goldGrad3)" 
            letter-spacing="8">PRINT &amp; PACK</text>

      <!-- Hairline Rule with Diamond -->
      <line x1="0" y1="65" x2="520" y2="65" stroke="url(#goldGrad3)" stroke-width="1.5" />
      <polygon points="210,62 214,65 210,68 206,65" fill="url(#goldGrad3)" />

      <!-- Subtitle Tagline -->
      <text x="0" y="95" 
            font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
            font-size="12" 
            font-weight="600" 
            fill="#6B665E" 
            letter-spacing="5">SUSTAINABLE PACKAGING MANUFACTURER • NEPAL</text>

      <text x="0" y="122" 
            font-family="'Playfair Display', Georgia, serif" 
            font-style="italic" 
            font-size="14" 
            fill="#8A8275">
        &ldquo;More than you anticipate...&rdquo;
      </text>
    </g>
  </g>
</svg>