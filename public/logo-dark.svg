<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="whiteLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2EFE9" />
    </linearGradient>
    <linearGradient id="mintLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D" />
      <stop offset="100%" stop-color="#52B788" />
    </linearGradient>
    <linearGradient id="goldDarkLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D08C" />
      <stop offset="100%" stop-color="#D4A353" />
    </linearGradient>
  </defs>

  <!-- ICON: Minimalist Artisan Bag with Botanical Sprout -->
  <g transform="translate(14, 4)">
    <!-- Bag Handle Loop -->
    <path d="M 37 32 C 37 14, 61 14, 61 32" 
          stroke="url(#whiteLogoGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" />
    <circle cx="37" cy="33" r="2.2" fill="url(#goldDarkLogoGrad)" />
    <circle cx="61" cy="33" r="2.2" fill="url(#goldDarkLogoGrad)" />

    <!-- Minimalist Bag Silhouette -->
    <path d="M 23 35 L 75 35 L 81 88 C 81 92, 78 95, 74 95 L 24 95 C 20 95, 17 92, 17 88 Z" 
          stroke="url(#whiteLogoGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round" />
    
    <!-- Subtle Inner Crease Line -->
    <path d="M 28 35 L 29 95" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-dasharray="3 3" />
    <path d="M 70 35 L 69 95" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-dasharray="3 3" />

    <!-- Twin Botanical Leaves (Authentic Logo Identity) -->
    <!-- Primary Upward Sprout -->
    <path d="M 18 95 C 4 90, -3 70, 9 52 C 22 66, 23 82, 18 95 Z" 
          fill="url(#mintLogoGrad)" />
    <path d="M 17 94 C 13 80, 7 67, 10 53" 
          stroke="url(#goldDarkLogoGrad)" 
          stroke-width="1.2" 
          stroke-linecap="round" />

    <!-- Secondary Small Leaf Sprout -->
    <path d="M 11 86 C -1 87, -7 75, 1 65 C 7 73, 10 80, 11 86 Z" 
          fill="url(#goldDarkLogoGrad)" opacity="0.85" />
  </g>

  <!-- TYPOGRAPHY: Editorial Luxury Layout -->
  <!-- "ECO" Main Title -->
  <text x="122" y="58" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="4" 
        fill="url(#whiteLogoGrad)">ECO</text>

  <!-- "PRINT & PACK" -->
  <text x="246" y="55" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="19" 
        font-weight="800" 
        letter-spacing="5" 
        fill="url(#whiteLogoGrad)">PRINT &amp; PACK</text>

  <!-- Architectural Hairline Divider with Center Accent -->
  <line x1="122" y1="72" x2="442" y2="72" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <line x1="246" y1="72" x2="330" y2="72" stroke="url(#goldDarkLogoGrad)" stroke-width="1.5" />
  <circle cx="246" cy="72" r="2" fill="url(#goldDarkLogoGrad)" />

  <!-- Subtitle: Authentic Manufacturer Tag -->
  <text x="123" y="89" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="9" 
        font-weight="700" 
        letter-spacing="3.2" 
        fill="#D6D3D1">SUSTAINABLE PACKAGING MANUFACTURERS</text>

  <!-- Nepal Heritage Seal -->
  <text x="398" y="89" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="800" 
        letter-spacing="2" 
        fill="url(#goldDarkLogoGrad)">• NEPAL</text>
</svg>
